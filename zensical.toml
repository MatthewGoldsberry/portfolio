[project]
site_name = "Matthew Goldsberry"
site_description = "Computer Science Student"
site_author = "Matthew Goldsberry"
site_url = "https://MatthewGoldsberry.github.io/"

extra_css = [
  "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css",
  "assets/styles/extra.css",
]

[project.theme]
language = "en"
custom_dir = "overrides"
favicon = "assets/favicon.png"

[project.plugins.search]

[project.markdown_extensions]
admonition = {}
footnotes = {}
attr_list = {}
md_in_html = {}

[project.markdown_extensions.toc]
toc_depth = 2
permalink = true

[project.markdown_extensions.pymdownx]
details = {}
superfences = {}
highlight = {}
inlinehilite = {}
tabbed = {}

[project.markdown_extensions.pymdownx.blocks]
caption = {}

[[project.nav]]
About = "index.md"

[[project.nav]]
Projects = [
  { "Projects Overview" = "projects/projects.md" },
  { "The Fellowship of the Script" = "project/the-fellowship-of-the-script.md" },
  { "Who You Gonna Call?" = "projects/who-you-gonna-call.md" },
  { "A World in Data" = "projects/a-world-in-data.md" },
  { "Smart Pong" = "projects/smart-pong.md" },
  { "Vis in the Wild" = "projects/vis-in-the-wild-critique.md" },
]

[[project.nav]]
Resume = "resume.md"
